<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>拉曼比特</title>
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="stylesheet" href="../shared/style.css">
<style>
/* 薄壳：占满视口，挂载单个模块 */
html,body{height:100%;margin:0}
.shell-nav{display:flex;align-items:center;gap:12px;padding:10px 16px;
  border-bottom:1px solid var(--line);background:var(--surf)}
.shell-nav .brand{font-weight:500}
.shell-nav .sp{flex:1}
.shell-nav a{color:var(--fg2);text-decoration:none;font-size:13px}
.shell-nav a:hover{color:var(--accent)}
.shell-host{max-width:1200px;margin:0 auto;padding:20px 24px 60px}
</style>
</head>
<body>
<div class="shell-nav">
  <span class="brand">拉曼比特</span>
  <a href="../index.html">← 首页</a>
  <a href="#" id="btn-share">复制链接</a>
  <span class="sp"></span>
  <span class="stamp" id="buildstamp"></span>
</div>
<div class="shell-host" id="host"></div>

<script src="../shared/wigner.js"></script>
<script src="../shared/constants.js"></script>
<script src="../shared/physics.js"></script>
<script src="../shared/units.js"></script>
<script src="../shared/urlstate.js"></script>
<script src="../shared/plot.js"></script>
<script src="../shared/version.js"></script>
<script src="../shell/store.js"></script>
<script src="../shell/registry.js"></script>
<script src="../modules/raman-qubit.js"></script>
<script>
(function () {
  'use strict';
  YBP.readTheme();
  YBV.render('buildstamp');

  /* URL 状态恢复：与主页面同一套 Store 编码，分享链接仍有效。
   * 兼容两套旧键：独立页旧键用 s3（小写），主页面用 S3（大写），都认。
   * 旧独立页的 f=/d=（求解目标/派生量）按规则④ 不恢复（舍4）。 */
  (function restoreStore() {
    var st = YBURL.read(), patch = {};
    var S3 = (st.S3 || st.s3 || {}).value;
    if (st.D)   patch['raman.detuning_Hz'] = st.D.value * 1e6;
    if (st.P)   patch['beam.P_laser'] = st.P.value * 1e-3;
    if (S3 !== undefined && S3 !== null) patch['beam.S3'] = S3;
    if (st.a)   patch['beam.alpha_deg'] = st.a.value;
    if (st.wx)  patch['beam.wx'] = st.wx.value * 1e-6;
    if (st.wy)  patch['beam.wy'] = st.wy.value * 1e-6;
    if (st.k)   patch['beam.theta_kB_deg'] = st.k.value;
    if (st.B)   patch['beam.B_G'] = st.B.value;
    if (st.eta) patch['beam.eta'] = st.eta.value;
    if (Object.keys(patch).length) YBStore.update(patch, '__url__');
  })();

  /* 全高挂载模块，非紧凑 */
  var inst = YBM.mount('raman-qubit', document.getElementById('host'), { compact: false });

  /* URL 状态写入：与主页面同一套 Store 编码，复制链接仍可被主页面/薄壳恢复 */
  function writeURL() {
    var s = YBStore.state;
    YBURL.write({
      D: { value: s.raman.detuning_Hz / 1e6, unit: 'MHz' },
      P: { value: s.beam.P_laser * 1e3, unit: 'mW' },
      S3: { value: s.beam.S3, unit: '' },
      a: { value: s.beam.alpha_deg, unit: '' },
      wx: { value: s.beam.wx * 1e6, unit: 'um' },
      wy: { value: s.beam.wy * 1e6, unit: 'um' },
      k: { value: s.beam.theta_kB_deg, unit: '' },
      B: { value: s.beam.B_G, unit: '' },
      eta: { value: s.beam.eta, unit: '' }
    });
  }
  document.getElementById('btn-share').onclick = function (e) {
    e.preventDefault();
    writeURL();
    YBURL.copyLink().then(function (ok) {
      var a = e.target, old = a.textContent;
      a.textContent = ok ? '已复制' : '复制失败';
      setTimeout(function () { a.textContent = old; }, 1400);
    });
  };
})();
</script>
</body>
</html>
