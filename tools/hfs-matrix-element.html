<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>超精细矩阵元</title>
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="stylesheet" href="../shared/style.css">
<style>
/* 薄壳：占满视口，挂载单个模块 */
html,body{height:100%;margin:0}
.shell-nav{display:flex;align-items:center;gap:12px;padding:10px 16px;
  border-bottom:1px solid var(--line);background:var(--surf)}
.shell-nav .brand{font-weight:500}
.shell-nav .sp{flex:1}
.shell-nav a{color:var(--fg2);text-decoration:none;font-size:13px}
.shell-nav a:hover{color:var(--accent)}
.shell-host{max-width:1200px;margin:0 auto;padding:20px 24px 60px}
</style>
</head>
<body>
<div class="shell-nav">
  <span class="brand">超精细矩阵元</span>
  <a href="../index.html">← 首页</a>
  <a href="#" id="btn-share">复制链接</a>
  <span class="sp"></span>
  <span class="stamp" id="buildstamp"></span>
</div>
<div class="shell-host" id="host"></div>

<script src="../shared/wigner.js"></script>
<script src="../shared/constants.js"></script>
<script src="../shared/physics.js"></script>
<script src="../shared/units.js"></script>
<script src="../shared/urlstate.js"></script>
<script src="../shared/plot.js"></script>
<script src="../shared/version.js"></script>
<script src="../shell/store.js"></script>
<script src="../shell/registry.js"></script>
<script src="../modules/hfs-matrix-element.js"></script>
<script>
(function () {
  'use strict';
  YBP.readTheme();
  YBV.render('buildstamp');

  /* URL 状态恢复：与主页面同一套 Store 编码（el/Ek/G），分享链接仍有效。
   * 模块 loadDB 后由 syncFromStore 据此定位到元素/跃迁。 */
  (function restoreStore() {
    var st = YBURL.read(), patch = {};
    if (st.Ek)  patch['transition.Ek_cm'] = st.Ek.value;
    if (st.G)   patch['transition.Gamma_Hz'] = st.G.value * 1e3;
    if (Object.keys(patch).length) YBStore.update(patch, '__url__');
  })();

  /* 全高挂载模块，非紧凑 */
  var inst = YBM.mount('hfs-matrix-element', document.getElementById('host'), { compact: false });

  /* URL 状态写入：与主页面同一套 Store 编码，复制链接仍可被主页面/薄壳恢复 */
  function writeURL() {
    var s = YBStore.state;
    YBURL.write({
      el: s.transition.element + s.transition.A,
      Ek: { value: s.transition.Ek_cm, unit: '' },
      G: { value: s.transition.Gamma_Hz / 1e3, unit: 'kHz' }
    });
  }
  document.getElementById('btn-share').onclick = function (e) {
    e.preventDefault();
    writeURL();
    YBURL.copyLink().then(function (ok) {
      var a = e.target, old = a.textContent;
      a.textContent = ok ? '已复制' : '复制失败';
      setTimeout(function () { a.textContent = old; }, 1400);
    });
  };
})();
</script>
</body>
</html>
